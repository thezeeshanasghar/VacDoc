<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/members/dashboard"></ion-back-button>
    </ion-buttons>
    <ion-title>Patients</ion-title>
    <ion-buttons slot="end">
      <ion-icon routerLink="/members/child/unapprove" name="close-circle-outline" class="toolbar-end-icon"></ion-icon>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <!-- PA/Manager clinic selector — moved inside ion-content -->
  <ion-item *ngIf="type === 'PA' || type === 'MANAGER'" class="clinic-select-item">
    <ion-label>Select Clinic</ion-label>
    <ion-select [(ngModel)]="selectedClinicId" (ionChange)="onClinicChange()">
      <ion-select-option *ngFor="let clinic of clinics" [value]="clinic.Id">
        {{ clinic.Name }}
      </ion-select-option>
    </ion-select>
  </ion-item>

  <form [formGroup]="fg">
    <ion-item>
      <ion-input type="text" placeholder="Search" formControlName="Name" (keyup.Enter)="getChlidbyUser(true)"
        required></ion-input>
      <ion-button [disabled]="isSearchDisabled" (click)="getChlidbyUser(true)">Search</ion-button>
      <ion-button *ngIf="search" (click)="getChlidByClinic(true)">Clear</ion-button>
    </ion-item>
  </form>

  <div *ngIf="initialLoading && childs.length === 0" class="skeleton-list">
    <div class="skeleton-card" *ngFor="let s of [1,2,3,4]">
      <div class="skeleton-row">
        <div class="skeleton-thumb"></div>
        <div class="skeleton-line skeleton-line-name"></div>
      </div>
      <div class="skeleton-line skeleton-line-sub"></div>
    </div>
  </div>

  <div *ngIf="!initialLoading && childs.length === 0 && page > 0" class="empty-state">
    <ion-icon name="search-outline"></ion-icon>
    <p>No patients match your search.</p>
  </div>

  <ion-card *ngFor="let child of childs; trackBy: trackByChildId" [ngClass]="child.Gender=='Girl' ? 'girl' : 'boy'">
    <!-- Grid: phone = header row / info row / buttons row; desktop (>=1000px) = one row -->
    <div class="pc-row">
      <ion-thumbnail class="pc-thumb">
        <ion-img [src]="child._avatarSrc || getAvatarImage(child)"></ion-img>
      </ion-thumbnail>
      <span class="pc-name">{{child.Name}}</span>
      <div class="pc-info">
        <span><ion-icon name="person"></ion-icon> {{child.FatherName}}</span>
        <span><ion-icon name="calendar"></ion-icon> {{child.DOB}}</span>
        <span class="pc-wa" (click)="openWhatsApp(child)"><ion-icon name="call"></ion-icon> {{child.MobileNumber}}</span>
      </div>
      <div class="pc-btns">
        <ion-button *ngIf="canViewVaccine" class="chip-tonal" size="small" fill="solid"
          routerLink="/members/child/vaccine/{{child.Id}}">
          Vaccine
        </ion-button>
        <ion-button *ngIf="canViewFollowup" class="chip-tonal" size="small" fill="solid"
          routerLink="/members/child/followup/{{child.Id}}">
          Follow Up
        </ion-button>
        <ion-button *ngIf="canDownloadPid" class="chip-tonal" size="small" fill="solid" (click)="downloadPdf(child.Id)">
          PID
        </ion-button>
        <ion-button *ngIf="canDownloadCard" size="small" fill="solid" color="secondary"
          [routerLink]="['/members/child/immunization-card', child.Id]"
          [queryParams]="{ name: child.Name }">
          <ion-icon name="card-outline" slot="start" style="font-size:14px;"></ion-icon>
          Card
        </ion-button>
      </div>
      <div class="pc-right">
        <span class="clinic-badge" *ngIf="child.ClinicName"><ion-icon name="business"></ion-icon><span class="clinic-badge-text">{{child.ClinicName}}</span></span>
        <ion-icon class="iconchild" name="ellipsis-vertical"
          *ngIf="canEditPatient || canDeletePatient || canSmsPatient || canCallPatient || canToggleStatus"
          (click)="openActions($event, child)"></ion-icon>
      </div>
    </div>
  </ion-card>

  <ion-infinite-scroll threshold="100%" (ionInfinite)="loadData()">
    <ion-infinite-scroll-content loadingSpinner="bubbles" loadingText="Loading more data...">
    </ion-infinite-scroll-content>
  </ion-infinite-scroll>

</ion-content>
