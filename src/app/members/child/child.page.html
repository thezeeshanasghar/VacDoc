<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/members/dashboard"></ion-back-button>
    </ion-buttons>
    <ion-title>Patients</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <!-- PA/Manager clinic selector — moved inside ion-content -->
  <ion-item *ngIf="type === 'PA' || type === 'MANAGER'" class="clinic-select-item">
    <ion-label>Select Clinic</ion-label>
    <ion-select [(ngModel)]="selectedClinicId" (ionChange)="onClinicChange()">
      <ion-select-option *ngFor="let clinic of clinics" [value]="clinic.Id">
        {{ clinic.Name }}
      </ion-select-option>
    </ion-select>
  </ion-item>

  <form [formGroup]="fg">
    <ion-item>
      <ion-input type="text" placeholder="Search" formControlName="Name" (keyup.Enter)="getChlidbyUser(true)"
        required></ion-input>
      <ion-button [disabled]="isSearchDisabled" (click)="getChlidbyUser(true)">Search</ion-button>
      <ion-button *ngIf="search" (click)="getChlidByClinic(true)">Clear</ion-button>
    </ion-item>
  </form>

  <div *ngIf="initialLoading && childs.length === 0" class="skeleton-list">
    <div class="skeleton-card" *ngFor="let s of [1,2,3,4]">
      <div class="skeleton-row">
        <div class="skeleton-thumb"></div>
        <div class="skeleton-line skeleton-line-name"></div>
      </div>
      <div class="skeleton-line skeleton-line-sub"></div>
    </div>
  </div>

  <div *ngIf="!initialLoading && childs.length === 0 && page > 0" class="empty-state">
    <ion-icon name="search-outline"></ion-icon>
    <p>No patients match your search.</p>
  </div>

  <div class="pt-list" *ngIf="childs.length > 0">
    <!-- Row: avatar | name, details, clinic flag | Vaccine, Card, PID, more. Phone: actions wrap to a second line. -->
    <div class="pt-row" *ngFor="let child of childs; trackBy: trackByChildId">
      <ion-thumbnail class="pt-avatar">
        <ion-img [src]="child._avatarSrc || getAvatarImage(child)"></ion-img>
      </ion-thumbnail>

      <div class="pt-info">
        <div class="pt-title">
          <span class="pt-name">{{child.Name}}</span>
          <span class="pt-status" *ngIf="child.IsInactive">Inactive</span>
        </div>
        <div class="pt-meta">
          <span><ion-icon name="person"></ion-icon> {{child.FatherName}}</span>
          <span><ion-icon name="calendar"></ion-icon> {{child.DOB}}</span>
          <span class="pt-phone" (click)="openWhatsApp(child)"><ion-icon name="logo-whatsapp"></ion-icon> {{child.MobileNumber}}</span>
        </div>
        <span class="pt-flag" *ngIf="child.ClinicName" [ngClass]="child._clinicHue"
          [attr.title]="child.ClinicName" [attr.aria-label]="'Clinic: ' + child.ClinicName">
          <ion-icon name="flag"></ion-icon>
          <b>{{child._clinicCode}}</b>
          <span class="pt-flag-name">{{child.ClinicName}}</span>
        </span>
      </div>

      <div class="pt-actions">
        <ion-button *ngIf="canViewVaccine" class="pt-act" size="small" fill="solid"
          routerLink="/members/child/vaccine/{{child.Id}}">
          Vaccine
        </ion-button>
        <ion-button *ngIf="canDownloadCard" class="pt-act" size="small" fill="solid"
          [routerLink]="['/members/child/immunization-card', child.Id]"
          [queryParams]="{ name: child.Name }">
          Card
        </ion-button>
        <ion-button *ngIf="canDownloadPid" class="pt-act" size="small" fill="solid" (click)="downloadPdf(child.Id)">
          PID
        </ion-button>
        <ion-button class="pt-more" size="small" fill="clear"
          *ngIf="canViewFollowup || canEditPatient || canDeletePatient || canSmsPatient || canCallPatient || canToggleStatus"
          [attr.aria-label]="'More actions for ' + child.Name"
          (click)="openActions($event, child)">
          <ion-icon slot="icon-only" name="ellipsis-horizontal"></ion-icon>
        </ion-button>
      </div>
    </div>
  </div>

  <ion-infinite-scroll threshold="100%" (ionInfinite)="loadData()">
    <ion-infinite-scroll-content loadingSpinner="bubbles" loadingText="Loading more data...">
    </ion-infinite-scroll-content>
  </ion-infinite-scroll>

</ion-content>
