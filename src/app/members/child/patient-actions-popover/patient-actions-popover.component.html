<ion-list class="patient-actions-list">
  <ion-item *ngIf="canFollowUp" button detail="false" lines="full" (click)="selectAction('followUp')">
    <ion-icon class="action-icon" slot="start" name="time-outline"></ion-icon>
    <ion-label>Follow Up</ion-label>
  </ion-item>
  <ion-item *ngIf="canEdit" button detail="false" lines="full" (click)="selectAction('edit')">
    <ion-icon class="action-icon" slot="start" name="create-outline"></ion-icon>
    <ion-label>Edit</ion-label>
  </ion-item>
  <ion-item *ngIf="canMessage" button detail="false" lines="full" (click)="selectAction('message')">
    <ion-icon class="action-icon" slot="start" name="mail-outline"></ion-icon>
    <ion-label>Message</ion-label>
  </ion-item>
  <ion-item *ngIf="canCall" button detail="false" lines="full" (click)="selectAction('call')">
    <ion-icon class="action-icon" slot="start" name="call-outline"></ion-icon>
    <ion-label>Call</ion-label>
  </ion-item>
  <ion-item *ngIf="canToggleStatus" button detail="false" [lines]="canDelete ? 'full' : 'none'" (click)="selectAction('toggleStatus')">
    <ion-icon class="action-icon" slot="start" [name]="isInactive ? 'checkmark-circle-outline' : 'ban-outline'" [color]="isInactive ? 'success' : 'danger'"></ion-icon>
    <ion-label [color]="isInactive ? 'success' : 'danger'">{{ isInactive ? 'Activate' : 'Deactivate' }}</ion-label>
  </ion-item>
  <ion-item *ngIf="canDelete" button detail="false" lines="none" (click)="selectAction('delete')">
    <ion-icon class="action-icon" slot="start" name="trash-outline" color="danger"></ion-icon>
    <ion-label color="danger">Delete</ion-label>
  </ion-item>
</ion-list>
