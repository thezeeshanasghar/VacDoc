<ion-header>
  <ion-toolbar color="primary">
      <ion-buttons slot="start">
          <ion-back-button defaultHref=""></ion-back-button>
      </ion-buttons>
      <ion-title>Add Clinic</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="fg1">
      <ion-item>
          <ion-label color="primary" position="floating">Name</ion-label>
          <ion-input type="text" formControlName="Name" class="ion-text-capitalize" required></ion-input>
      </ion-item>
      <div class="validation-errors">
          <ng-container *ngFor="let validation of validation_messages.Name">
              <div class="error-message"
                  *ngIf="fg1.get('Name').hasError(validation.type) && (fg1.get('Name').dirty || fg1.get('Name').touched)">
                  <ion-icon name="information-circle-outline"></ion-icon> {{ validation.message }}
              </div>
          </ng-container>
      </div>

      <ion-item>
          <ion-label color="primary" position="floating">Phone Number</ion-label>
          <ion-input type="text" formControlName="PhoneNumber" required></ion-input>
      </ion-item>
      <div class="validation-errors">
          <ng-container *ngFor="let validation of validation_messages.phoneNumber">
              <div class="error-message"
                  *ngIf="fg1.get('PhoneNumber').hasError(validation.type) && (fg1.get('PhoneNumber').dirty || fg1.get('PhoneNumber').touched)">
                  <ion-icon name="information-circle-outline"></ion-icon> {{ validation.message }}
              </div>
          </ng-container>
      </div>

      <ion-item>
          <ion-label color="primary" position="floating">Address</ion-label>
          <ion-textarea type="text" formControlName="Address" class="ion-text-capitalize" required></ion-textarea>
      </ion-item>
      <div class="validation-errors">
          <ng-container *ngFor="let validation of validation_messages.Address">
              <div class="error-message"
                  *ngIf="fg1.get('Address').hasError(validation.type) && (fg1.get('Address').dirty || fg1.get('Address').touched)">
                  <ion-icon name="information-circle-outline"></ion-icon> {{ validation.message }}
              </div>
          </ng-container>
      </div>

      <ion-item>
          <ion-label color="primary" position="floating">Consultation Fee</ion-label>
          <ion-input type="text" formControlName="ConsultationFee" required></ion-input>
      </ion-item>

      <div class="validation-errors">
          <ng-container *ngFor="let validation of validation_messages.ConsultationFee">
              <div class="error-message"
                  *ngIf="fg1.get('ConsultationFee').hasError(validation.type) && (fg1.get('ConsultationFee').dirty || fg1.get('ConsultationFee').touched)">
                  <ion-icon name="information-circle-outline"></ion-icon> {{ validation.message }}
              </div>
          </ng-container>
      </div>

    <ion-item>
        <ion-label color="primary" position="floating">Registration No.</ion-label>
        <ion-input type="text" formControlName="RegNo"></ion-input>
    </ion-item>

    <div class="validation-errors">
        <ng-container *ngFor="let validation of validation_messages.RegNo">
            <div class="error-message"
                *ngIf="fg1.get('RegNo').hasError(validation.type) && (fg1.get('RegNo').dirty || fg1.get('RegNo').touched)">
                <ion-icon name="information-circle-outline"></ion-icon> {{ validation.message }}
            </div>
        </ng-container>
    </div>

      <ion-item>
        <ion-label color="primary">Upload Monogram <span class="ion-text-wrap">(optional)</span></ion-label>
        <input type="file" (change)="SelectMonogramImage($event.target.files)" accept=".png, .jpg, .jpeg" />
    </ion-item>

      <ion-item style="min-height: 300px;">
          <div #mapElement class="map" style="min-height: 300px;"></div>
      </ion-item>

      <ion-button [disabled]="!fg1.valid" (click)="getdata()">Add Clinic</ion-button>
  </form>


</ion-content>
