<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/members/doctor"></ion-back-button>
    </ion-buttons>
    <ion-title>Email Settings</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="fg">

    <ion-item>
      <ion-label color="primary" position="floating">SMTP Host</ion-label>
      <ion-input type="text" formControlName="SmtpHost" placeholder="smtp.hostinger.com" required></ion-input>
    </ion-item>
    <div class="validation-errors">
      <ng-container *ngFor="let validation of validation_messages.SmtpHost">
        <div class="error-message" *ngIf="fg.get('SmtpHost').hasError(validation.type) && (fg.get('SmtpHost').dirty || fg.get('SmtpHost').touched)">
          <ion-icon name="information-circle-outline"></ion-icon> {{ validation.message }}
        </div>
      </ng-container>
    </div>

    <ion-item>
      <ion-label color="primary" position="floating">Port</ion-label>
      <ion-input type="number" formControlName="SmtpPort" placeholder="587" required></ion-input>
    </ion-item>
    <div class="validation-errors">
      <ng-container *ngFor="let validation of validation_messages.SmtpPort">
        <div class="error-message" *ngIf="fg.get('SmtpPort').hasError(validation.type) && (fg.get('SmtpPort').dirty || fg.get('SmtpPort').touched)">
          <ion-icon name="information-circle-outline"></ion-icon> {{ validation.message }}
        </div>
      </ng-container>
    </div>

    <ion-item>
      <ion-label color="primary">Use SSL / TLS</ion-label>
      <ion-toggle formControlName="SmtpUseSsl" slot="end"></ion-toggle>
    </ion-item>

    <ion-item>
      <ion-label color="primary" position="floating">Username</ion-label>
      <ion-input type="text" formControlName="SmtpUsername" placeholder="you@yourclinic.com" required></ion-input>
    </ion-item>
    <div class="validation-errors">
      <ng-container *ngFor="let validation of validation_messages.SmtpUsername">
        <div class="error-message" *ngIf="fg.get('SmtpUsername').hasError(validation.type) && (fg.get('SmtpUsername').dirty || fg.get('SmtpUsername').touched)">
          <ion-icon name="information-circle-outline"></ion-icon> {{ validation.message }}
        </div>
      </ng-container>
    </div>

    <ion-item>
      <ion-label color="primary" position="floating">Password</ion-label>
      <ion-input type="password" formControlName="SmtpPassword" required></ion-input>
    </ion-item>
    <div class="validation-errors">
      <ng-container *ngFor="let validation of validation_messages.SmtpPassword">
        <div class="error-message" *ngIf="fg.get('SmtpPassword').hasError(validation.type) && (fg.get('SmtpPassword').dirty || fg.get('SmtpPassword').touched)">
          <ion-icon name="information-circle-outline"></ion-icon> {{ validation.message }}
        </div>
      </ng-container>
    </div>

    <ion-item>
      <ion-label color="primary" position="floating">From Email</ion-label>
      <ion-input type="text" formControlName="SmtpFromEmail" required></ion-input>
    </ion-item>
    <div class="validation-errors">
      <ng-container *ngFor="let validation of validation_messages.SmtpFromEmail">
        <div class="error-message" *ngIf="fg.get('SmtpFromEmail').hasError(validation.type) && (fg.get('SmtpFromEmail').dirty || fg.get('SmtpFromEmail').touched)">
          <ion-icon name="information-circle-outline"></ion-icon> {{ validation.message }}
        </div>
      </ng-container>
    </div>

    <ion-item>
      <ion-label color="primary" position="floating">From Name (optional)</ion-label>
      <ion-input type="text" formControlName="SmtpFromName"></ion-input>
    </ion-item>

    <ion-button expand="block" class="ion-margin-top" (click)="saveSettings()">
      Save Settings
    </ion-button>

    <ion-button expand="block" fill="outline" (click)="sendTestEmail()">
      Send Test Email To Myself
    </ion-button>

    <div *ngIf="resultMessage" class="result-box" [class.result-success]="resultSuccess" [class.result-error]="!resultSuccess">
      {{ resultMessage }}
    </div>

  </form>
</ion-content>
